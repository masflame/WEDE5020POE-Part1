<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Bakery - Create Account</title>
</head>
<body>
    <header>
        <h1>Sunrise Bakery</h1>
        <nav><ul>
            <li><a href="index.html">Home</a></li><li><a href="about.html">About Us</a></li><li><a href="shop.html">Shop</a></li><li><a href="enquiry.html">Enquiry</a></li><li><a href="contact.html">Contact</a></li>
        </ul></nav>
    </header>
    <main>
        <h2>Create Your Account</h2>
        <p>Save your details for a smoother Sunrise Bakery experience.</p>
        <form action="#" method="post">
            <p><label for="full-name">Full name</label><br><input type="text" id="full-name" name="full-name" autocomplete="name" required></p>
            <p><label for="account-email">Email address</label><br><input type="email" id="account-email" name="email" autocomplete="email" required></p>
            <p><label for="account-phone">Phone number</label><br><input type="tel" id="account-phone" name="phone" autocomplete="tel" required></p>
            <p><label for="new-password">Create password</label><br><input type="password" id="new-password" name="password" autocomplete="new-password" minlength="8" required></p>
            <p><button type="submit">Create Account</button></p>
        </form>
        <p>Already have an account? <a href="login.html">Log in</a>.</p>
    </main>
    <footer><p>&copy; 2026 Sunrise Bakery. All rights reserved.</p><p>Polokwane, Limpopo, South Africa</p></footer>
</body>
</html>
